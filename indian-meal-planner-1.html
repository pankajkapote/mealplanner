<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaj Kya Banaye — Weekly Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

<style>
  :root{
    --wheat: #F1E8D6;
    --wheat-deep: #E7DABF;
    --card: #FFFDF8;
    --ink: #2E2118;
    --ink-soft: #6B5D4F;
    --chili: #A93226;
    --chili-deep: #7E241B;
    --turmeric: #C9862E;
    --turmeric-soft: #F0D9AE;
    --cardamom: #5C7A52;
    --cardamom-soft: #DCE5D1;
    --steel: #ECEAE2;
    --rule: #D8CBAE;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--wheat);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(46,33,24,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap{max-width: 980px; margin: 0 auto;}

  /* ---------- Header / signature ---------- */
  header{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .dabba{
    width:64px; height:64px; flex-shrink:0;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(28px, 4vw, 38px);
    margin:0;
    color: var(--chili-deep);
    letter-spacing: -0.5px;
  }
  .tagline{
    margin:2px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
  }

  /* ---------- Setup card ---------- */
  .setup{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 26px;
    box-shadow: 0 2px 0 var(--rule);
  }
  .setup-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
    gap: 16px;
    align-items:end;
  }
  .field label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chili-deep);
    margin-bottom: 6px;
  }
  .stepper{
    display:flex; align-items:center;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    overflow:hidden;
    background: var(--steel);
    width: fit-content;
  }
  .stepper button{
    width: 38px; height: 38px;
    border:none; background: transparent;
    font-size: 18px; font-weight:700;
    color: var(--chili-deep);
    cursor:pointer;
  }
  .stepper button:hover{ background: var(--turmeric-soft); }
  .stepper input{
    width: 46px; text-align:center;
    border:none; background:transparent;
    font-family:'Baloo 2'; font-weight:700; font-size:16px;
    color: var(--ink);
  }
  select{
    width:100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--rule);
    background: var(--steel);
    font-family:'Karla', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .meal-toggles{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .chip{
    padding: 7px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--rule);
    background: var(--steel);
    font-size: 13px; font-weight:600;
    cursor:pointer; user-select:none;
    color: var(--ink-soft);
  }
  .chip.on{
    background: var(--cardamom);
    border-color: var(--cardamom);
    color: white;
  }
  .generate-row{
    display:flex; justify-content:flex-end; margin-top:18px;
  }
  .btn-primary{
    background: var(--chili);
    color: white;
    border:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 10px;
    cursor:pointer;
    box-shadow: 0 3px 0 var(--chili-deep);
    transition: transform .05s;
  }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--chili-deep); }
  .btn-primary:hover{ background:#B8392C; }

  /* ---------- Plan grid ---------- */
  .plan-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin: 8px 0 14px;
    flex-wrap:wrap; gap:8px;
  }
  .plan-head h2{
    font-family:'Baloo 2'; font-size:20px; margin:0; color:var(--ink);
  }
  .plan-head .note{ font-size:13px; color:var(--ink-soft); }

  .day-block{
    margin-bottom: 16px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .day-title{
    background: var(--wheat-deep);
    padding: 9px 16px;
    font-family:'Baloo 2'; font-weight:700; font-size:15px;
    color: var(--chili-deep);
    border-bottom: 1px solid var(--rule);
  }
  .meal-row{
    display:grid;
    grid-template-columns: 120px 1fr 34px;
    gap: 0;
    align-items:center;
    border-bottom: 1px dashed var(--rule);
  }
  .meal-row:last-child{ border-bottom:none; }
  .meal-label{
    display:flex; align-items:center; gap:8px;
    padding: 12px 14px;
    font-size: 12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em;
    color: var(--ink-soft);
    border-right: 1px solid var(--rule);
    height: 100%;
  }
  .meal-icon{ font-size:16px; }
  .meal-content{ padding: 10px 14px; }
  .recipe-name{
    font-family:'Baloo 2'; font-weight:700; font-size:15px;
    color: var(--ink); margin:0 0 2px;
  }
  .recipe-desc{
    font-size: 13px; color: var(--ink-soft); margin:0;
    line-height:1.4;
  }
  .recipe-meta{
    font-size:11px; color: var(--cardamom); font-weight:700;
    margin-top:4px; text-transform:uppercase; letter-spacing:.04em;
  }
  .shuffle-btn{
    width:34px; height:34px;
    border:none; background:transparent;
    cursor:pointer; font-size:16px;
    color: var(--turmeric);
    display:flex; align-items:center; justify-content:center;
  }
  .shuffle-btn:hover{ color: var(--chili); transform: rotate(25deg); }

  .empty-state{
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1.5px dashed var(--rule);
    border-radius: var(--radius);
  }

  .footer-actions{
    display:flex; justify-content:center; gap:10px; margin-top:20px;
  }
  .btn-secondary{
    background: var(--steel);
    border: 1.5px solid var(--rule);
    color: var(--ink);
    font-family:'Karla'; font-weight:700; font-size:13px;
    padding: 9px 16px; border-radius:10px; cursor:pointer;
  }
  .btn-secondary:hover{ background: var(--turmeric-soft); }

  @media print{
    .setup, .footer-actions, header .tagline{ display:none; }
    body{ background:white; padding:0; }
    .shuffle-btn{ display:none; }
  }

  @media (max-width: 520px){
    .meal-row{ grid-template-columns: 90px 1fr 30px; }
    .meal-label span.txt{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="dabba" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#ECEAE2" stroke="#A93226" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="#C9862E" stroke-width="2"/>
      <line x1="32" y1="11" x2="32" y2="53" stroke="#D8CBAE" stroke-width="1.5"/>
      <line x1="11" y1="32" x2="53" y2="32" stroke="#D8CBAE" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="4.5" fill="#5C7A52"/>
    </svg>
    <div>
      <h1>Aaj Kya Banaye?</h1>
      <p class="tagline">Set your household once — get a full week of breakfast, tiffin, lunch &amp; dinner, sorted.</p>
    </div>
  </header>

  <div class="setup">
    <div class="setup-grid">
      <div class="field">
        <label for="members">Family members</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <input type="text" id="members" value="4" readonly>
          <button type="button" id="plus">+</button>
        </div>
      </div>

      <div class="field">
        <label for="diet">Diet</label>
        <select id="diet">
          <option value="veg">Vegetarian</option>
          <option value="both" selected>Veg + occasional non-veg</option>
        </select>
      </div>

      <div class="field">
        <label for="region">Kitchen leaning</label>
        <select id="region">
          <option value="any" selected>Mixed / any region</option>
          <option value="north">North Indian</option>
          <option value="south">South Indian</option>
          <option value="west">West Indian</option>
          <option value="east">East Indian</option>
        </select>
      </div>

      <div class="field">
        <label>Meals to plan</label>
        <div class="meal-toggles">
          <div class="chip on" data-meal="breakfast">Breakfast</div>
          <div class="chip on" data-meal="tiffin">School Tiffin</div>
          <div class="chip on" data-meal="lunch">Lunch</div>
          <div class="chip on" data-meal="dinner">Dinner</div>
        </div>
      </div>
    </div>

    <div class="generate-row">
      <button class="btn-primary" id="generateBtn">Generate the week's plan</button>
    </div>
  </div>

  <div id="planArea">
    <div class="empty-state">Set your preferences above and generate your first weekly plan. 🍛</div>
  </div>

  <div class="footer-actions" id="footerActions" style="display:none;">
    <button class="btn-secondary" id="regenAllBtn">↻ Regenerate whole week</button>
    <button class="btn-secondary" id="printBtn">🖨 Print / save plan</button>
  </div>

</div>

<script>
/* ---------------- Recipe database ---------------- */
const DB = {
  breakfast: [
    {name:"Poha", desc:"Flattened rice tossed with onion, peanuts, curry leaves & lemon.", veg:true, region:"west"},
    {name:"Upma", desc:"Roasted semolina cooked with mustard seeds, veggies & curry leaves.", veg:true, region:"south"},
    {name:"Idli with Sambar", desc:"Steamed rice cakes served with lentil-vegetable stew.", veg:true, region:"south"},
    {name:"Aloo Paratha with Curd", desc:"Stuffed potato flatbread, served with fresh curd & pickle.", veg:true, region:"north"},
    {name:"Besan Chilla", desc:"Savoury gram-flour pancakes with onion, tomato & spices.", veg:true, region:"north"},
    {name:"Plain Dosa with Chutney", desc:"Crisp fermented rice-lentil crepe with coconut chutney.", veg:true, region:"south"},
    {name:"Sabudana Khichdi", desc:"Tapioca pearls with peanuts, potato & curry leaves.", veg:true, region:"west"},
    {name:"Vegetable Daliya", desc:"Broken wheat porridge cooked with mixed vegetables.", veg:true, region:"north"},
    {name:"Moong Dal Chilla", desc:"Protein-rich lentil pancakes, light and easy on the stomach.", veg:true, region:"north"},
    {name:"Masala Oats", desc:"Oats tempered with mustard seeds, onion & vegetables.", veg:true, region:"any"},
    {name:"Egg Bhurji with Toast", desc:"Spiced scrambled eggs served with buttered toast.", veg:false, region:"any"},
    {name:"Puri Bhaji", desc:"Fried puffed bread with a mildly spiced potato curry.", veg:true, region:"north"},
    {name:"Thepla with Pickle", desc:"Fenugreek-spiced flatbread, a Gujarati breakfast staple.", veg:true, region:"west"},
    {name:"Idiyappam with Coconut Milk", desc:"Steamed rice noodles served with sweetened coconut milk.", veg:true, region:"south"},
    {name:"Vegetable Uttapam", desc:"Thick savoury rice pancake topped with onion & tomato.", veg:true, region:"south"},
    {name:"Stuffed Methi Paratha", desc:"Fenugreek leaf flatbread, served with curd.", veg:true, region:"north"},
  ],
  tiffin: [
    {name:"Vegetable Paratha Roll", desc:"Mixed-veg stuffed paratha rolled up, easy to eat cold.", veg:true, region:"north"},
    {name:"Veg Cheese Sandwich", desc:"Grilled sandwich with cucumber, tomato & cheese.", veg:true, region:"any"},
    {name:"Curd Rice", desc:"Comforting rice mixed with curd, tempered lightly, no reheating needed.", veg:true, region:"south"},
    {name:"Vegetable Fried Rice", desc:"Lightly spiced rice with mixed vegetables, kid-friendly.", veg:true, region:"any"},
    {name:"Indian-style Pasta", desc:"Pasta tossed with ketchup, veggies & mild masala.", veg:true, region:"any"},
    {name:"Paneer Roll", desc:"Soft roti rolled with spiced paneer and veggies.", veg:true, region:"north"},
    {name:"Stuffed Paratha with Dry Sabzi", desc:"Paratha paired with a simple no-gravy vegetable.", veg:true, region:"north"},
    {name:"Lemon Rice", desc:"Tangy tempered rice with peanuts and curry leaves.", veg:true, region:"south"},
    {name:"Vegetable Cutlet with Bread", desc:"Pan-fried veggie cutlets with buttered bread slices.", veg:true, region:"any"},
    {name:"Chapati Roll with Dry Aloo Sabzi", desc:"Simple roti rolled with a mildly spiced potato filling.", veg:true, region:"north"},
    {name:"Mini Uttapam", desc:"Bite-sized savoury pancakes, easy to pack and eat.", veg:true, region:"south"},
    {name:"Puliyogare (Tamarind Rice)", desc:"Tangy tamarind-flavoured rice, stays fresh for hours.", veg:true, region:"south"},
    {name:"Vegetable Khichdi (thick)", desc:"Soft-cooked rice-lentil mix, mild and filling.", veg:true, region:"any"},
    {name:"Corn & Peas Cutlet Sandwich", desc:"Sweetcorn-peas patty tucked into soft bread.", veg:true, region:"any"},
    {name:"Aloo Tikki Wrap", desc:"Spiced potato patty wrapped in soft roti.", veg:true, region:"north"},
  ],
  lunch: [
    {name:"Dal Tadka, Jeera Rice, Roti & Salad", desc:"Everyday tempered lentils with cumin rice and fresh salad.", veg:true, region:"north"},
    {name:"Rajma Chawal", desc:"Kidney bean curry simmered in tomato gravy, served with rice.", veg:true, region:"north"},
    {name:"Chole with Rice", desc:"Spiced chickpea curry, a weekend favourite.", veg:true, region:"north"},
    {name:"Sambar, Rice & Poriyal", desc:"Lentil-vegetable stew with rice and a stir-fried side vegetable.", veg:true, region:"south"},
    {name:"Kadhi Chawal", desc:"Tangy yogurt-gram flour curry with steamed rice.", veg:true, region:"north"},
    {name:"Mixed Vegetable Curry with Roti", desc:"Seasonal vegetables in a light onion-tomato gravy.", veg:true, region:"any"},
    {name:"Bhindi Masala, Dal & Roti", desc:"Stir-fried okra with lentils and flatbread.", veg:true, region:"north"},
    {name:"Baingan Bharta with Roti", desc:"Smoky mashed eggplant curry, a classic pairing with roti.", veg:true, region:"north"},
    {name:"Palak Paneer with Roti", desc:"Cottage cheese cubes in a spiced spinach gravy.", veg:true, region:"north"},
    {name:"Chicken Curry with Rice", desc:"Home-style chicken curry simmered with everyday spices.", veg:false, region:"any"},
    {name:"Fish Curry with Rice", desc:"Coastal-style fish curry in a tangy coconut base.", veg:false, region:"south"},
    {name:"Egg Curry with Roti", desc:"Boiled eggs simmered in a spiced onion-tomato gravy.", veg:false, region:"any"},
    {name:"Kadai Paneer with Roti", desc:"Paneer and peppers tossed in a bold kadai masala.", veg:true, region:"north"},
    {name:"Gobi Aloo, Dal & Roti", desc:"Cauliflower-potato dry sabzi with lentils and flatbread.", veg:true, region:"north"},
    {name:"Curd Rice, Pickle & Papad", desc:"A light, cooling lunch for a warm afternoon.", veg:true, region:"south"},
    {name:"Vegetable Pulao with Raita", desc:"One-pot spiced rice with mixed vegetables and cooling yogurt.", veg:true, region:"any"},
    {name:"Mutton Curry with Rice", desc:"Slow-cooked mutton curry, a weekend indulgence.", veg:false, region:"any"},
    {name:"Aloo Gobi with Dal & Roti", desc:"Classic potato-cauliflower dry sabzi with lentils.", veg:true, region:"north"},
    {name:"Prawn Curry with Rice", desc:"Coconut-based coastal prawn curry.", veg:false, region:"south"},
  ],
  dinner: [
    {name:"Khichdi with Kadhi", desc:"Light rice-lentil khichdi with tangy yogurt curry — easy on digestion.", veg:true, region:"any"},
    {name:"Vegetable Soup with Grilled Sandwich", desc:"A light, warm option for a low-key dinner.", veg:true, region:"any"},
    {name:"Roti, Dal & Light Sabzi", desc:"Simple everyday combination, easy to make after a long day.", veg:true, region:"north"},
    {name:"Paneer Bhurji with Roti", desc:"Scrambled spiced paneer, quick to put together.", veg:true, region:"north"},
    {name:"Vegetable Pulao", desc:"One-pot rice with vegetables, needs no extra side.", veg:true, region:"any"},
    {name:"Moong Dal Khichdi", desc:"Light, protein-rich khichdi, gentle on the stomach at night.", veg:true, region:"any"},
    {name:"Egg Curry with Roti", desc:"Simple egg curry, quicker than a meat-based one.", veg:false, region:"any"},
    {name:"Chicken Stew with Rice", desc:"Mild coconut-based stew, comforting for dinner.", veg:false, region:"south"},
    {name:"Mixed Dal with Roti", desc:"A blend of lentils cooked simply with roti.", veg:true, region:"any"},
    {name:"Vegetable Stir-fry with Roti", desc:"Quick tossed vegetables with light seasoning.", veg:true, region:"any"},
    {name:"Tomato Soup with Multigrain Toast", desc:"A light finish to the day.", veg:true, region:"any"},
    {name:"Methi Thepla with Curd", desc:"Leftover-friendly flatbread paired with fresh curd.", veg:true, region:"west"},
    {name:"Dal Palak with Rice", desc:"Spinach-lentil curry, nutritious and light.", veg:true, region:"north"},
    {name:"Stuffed Capsicum with Roti", desc:"Bell peppers stuffed with a spiced potato filling.", veg:true, region:"north"},
    {name:"Paneer Tikka with Roti", desc:"Grilled spiced paneer, a lighter tandoor-style dinner.", veg:true, region:"north"},
  ]
};

const MEAL_META = {
  breakfast: {label:"Breakfast", icon:"☀️"},
  tiffin: {label:"Tiffin", icon:"🍱"},
  lunch: {label:"Lunch", icon:"🍛"},
  dinner: {label:"Dinner", icon:"🌙"}
};
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

let currentPlan = {}; // { mealType: [7 recipe objects] }
let activeMeals = ["breakfast","tiffin","lunch","dinner"];

/* ---------------- Helpers ---------------- */
function filteredPool(mealType){
  const diet = document.getElementById('diet').value;
  const region = document.getElementById('region').value;
  return DB[mealType].filter(r=>{
    const dietOk = diet === 'veg' ? r.veg : true;
    const regionOk = region === 'any' ? true : (r.region === region || r.region === 'any');
    return dietOk && regionOk;
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickWeek(mealType){
  let pool = shuffle(filteredPool(mealType));
  if(pool.length === 0) pool = shuffle(DB[mealType]); // fallback if filters too strict
  const week = [];
  for(let i=0;i<7;i++){
    if(pool.length === 0) pool = shuffle(filteredPool(mealType).length ? filteredPool(mealType) : DB[mealType]);
    week.push(pool.pop());
  }
  return week;
}

function pickOne(mealType, avoidName){
  let pool = filteredPool(mealType).filter(r=>r.name !== avoidName);
  if(pool.length === 0) pool = DB[mealType].filter(r=>r.name !== avoidName);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------------- Rendering ---------------- */
function render(){
  const planArea = document.getElementById('planArea');
  const footer = document.getElementById('footerActions');
  if(Object.keys(currentPlan).length === 0){
    planArea.innerHTML = '<div class="empty-state">Set your preferences above and generate your first weekly plan. 🍛</div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'flex';
  const members = document.getElementById('members').value;

  let html = `<div class="plan-head">
      <h2>This week's plan</h2>
      <div class="note">Serving size: ~${members} people per meal · tap ↻ to swap a dish</div>
    </div>`;

  DAYS.forEach((day, dayIdx)=>{
    html += `<div class="day-block"><div class="day-title">${day}</div>`;
    activeMeals.forEach(mealType=>{
      const recipe = currentPlan[mealType][dayIdx];
      const meta = MEAL_META[mealType];
      html += `
        <div class="meal-row">
          <div class="meal-label"><span class="meal-icon">${meta.icon}</span><span class="txt">${meta.label}</span></div>
          <div class="meal-content">
            <p class="recipe-name">${recipe.name}</p>
            <p class="recipe-desc">${recipe.desc}</p>
            <div class="recipe-meta">${recipe.veg ? 'Veg' : 'Non-veg'} · ${recipe.region === 'any' ? 'Pan-India' : recipe.region.charAt(0).toUpperCase()+recipe.region.slice(1)+' Indian'}</div>
          </div>
          <button class="shuffle-btn" data-meal="${mealType}" data-day="${dayIdx}" title="Swap this dish">↻</button>
        </div>`;
    });
    html += `</div>`;
  });

  planArea.innerHTML = html;

  planArea.querySelectorAll('.shuffle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mealType = btn.dataset.meal;
      const day = parseInt(btn.dataset.day,10);
      const current = currentPlan[mealType][day];
      currentPlan[mealType][day] = pickOne(mealType, current.name);
      render();
    });
  });
}

function generatePlan(){
  activeMeals = Array.from(document.querySelectorAll('.chip.on')).map(c=>c.dataset.meal);
  if(activeMeals.length === 0){ alert('Pick at least one meal to plan.'); return; }
  currentPlan = {};
  activeMeals.forEach(mealType=>{
    currentPlan[mealType] = pickWeek(mealType);
  });
  render();
}

/* ---------------- Controls ---------------- */
document.getElementById('minus').addEventListener('click', ()=>{
  const input = document.getElementById('members');
  input.value = Math.max(1, parseInt(input.value,10)-1);
  if(Object.keys(currentPlan).length) render();
});
document.getElementById('plus').addEventListener('click', ()=>{
  const input = document.getElementById('members');
  input.value = Math.min(15, parseInt(input.value,10)+1);
  if(Object.keys(currentPlan).length) render();
});
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=> chip.classList.toggle('on'));
});
document.getElementById('generateBtn').addEventListener('click', generatePlan);
document.getElementById('regenAllBtn').addEventListener('click', generatePlan);
document.getElementById('printBtn').addEventListener('click', ()=> window.print());
</script>
</body>
</html>
